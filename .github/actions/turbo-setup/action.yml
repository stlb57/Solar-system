name: "Checkout and Node setup"
description: "Checkout and Node setup"
inputs:
  node-version:
    description: 'Input the node version'
    required: false
    default: '16'
runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }} 
    - name: Setup-node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
      shell: bash
      

